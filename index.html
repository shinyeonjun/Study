<!doctype html>

<style>
  /* 전체 홈 전용. 책꽂이에 책 표지가 놓인 모양. 과목별 스타일은 각 폴더가 따로 가진다. */
  :root { --bg:#e9e5dc; --paper:#fffdf8; --text:#1e1c19; --muted:#6c665c; --line:#d9d2c3; --shelf:#b9ad97; --shadow:0 2px 4px rgba(30,28,25,.10), 0 14px 30px rgba(30,28,25,.14); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121110; --paper:#1c1b19; --text:#e9e5dc; --muted:#a39c8f; --line:#302d28; --shelf:#3a362f; --shadow:0 2px 4px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; line-height:1.7; word-break:keep-all; }
  main { max-width:880px; margin:0 auto; padding:64px 20px 96px; }
  h1 { font-size:2.4rem; font-weight:800; letter-spacing:-.02em; margin:0 0 8px; }
  .lead { color:var(--muted); margin:0 0 44px; }
  .shelf { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:34px 30px; align-items:end; padding:0 8px 22px; border-bottom:10px solid var(--shelf); border-radius:0 0 4px 4px; }
  a.cover { position:relative; display:flex; flex-direction:column; justify-content:space-between; aspect-ratio:3 / 4; padding:26px 22px 22px 34px; border-radius:3px 8px 8px 3px; color:#fff; text-decoration:none; box-shadow:var(--shadow); transition:transform .15s ease; overflow:hidden; }
  a.cover::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background:rgba(0,0,0,.22); border-right:1px solid rgba(255,255,255,.18); }
  a.cover:hover, a.cover:focus-visible { transform:translateY(-6px); outline:none; }
  .cover.navy { background:#1f4e8c; }
  .cover.wine { background:#3a3f4b; }
  .cover.green { background:#2f5d50; }
  .cover small { display:block; font-size:.78rem; font-weight:700; letter-spacing:.06em; opacity:.8; }
  .cover b { display:block; font-size:1.55rem; line-height:1.3; margin-top:8px; letter-spacing:-.01em; }
  .cover p { margin:0; font-size:.9rem; line-height:1.6; opacity:.92; }
  .cover .state { display:inline-block; margin-top:14px; font-size:.75rem; font-weight:700; padding:3px 10px; border-radius:999px; background:rgba(255,255,255,.18); }
  .note { color:var(--muted); font-size:.88rem; margin-top:28px; }
  @media (max-width:520px) { main { padding-top:40px; } h1 { font-size:2rem; } .shelf { grid-template-columns:1fr 1fr; gap:20px 16px; } a.cover { aspect-ratio:auto; min-height:230px; padding:18px 14px 16px 26px; } .cover b { font-size:1.2rem; } .cover p { display:none; } .cover .state { margin-top:0; } }
</style>
</head>
<body>
<main>

    <span><p>시험 과목별로 한 장씩. 공통 기초는 공부 교재와 연결.</p><span class="state">함께 준비 중</span></span>
  </a>
  <a class="cover wine" href="jcg/index.html">
