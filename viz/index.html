<script>
(function () {
  var toc = document.getElementById("toc");
  VIZ_GROUPS.forEach(function (g, gi) {
    var ps = VIZ_PAGES.filter(function (p) { return p.group === gi; });
    if (!ps.length) return;
    V.h("p", "group", g, toc);
    var cards = V.h("div", "cards", null, toc);
    ps.forEach(function (p) {
      var a = V.h(p.ready ? "a" : "div", "card" + (p.ready ? "" : " off"), null, cards);
      if (p.ready) a.href = p.href;
      V.h("span", "no", String(VIZ_PAGES.indexOf(p) + 1), a);
      V.h("b", "", p.title, a);
      V.h("span", "", p.kw, a);
    });
  });
})();
