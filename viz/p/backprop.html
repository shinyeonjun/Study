<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>역전파 · 움직이는 AI</title>
<link rel="stylesheet" href="../style.css">
</head>
<body data-page="backprop">
<main class="stage">
<h1>역전파 = 끝에서 1로 출발해 칸마다 배율을 곱하며 거꾸로</h1>
<p class="sub">값은 왼쪽에서 오른쪽으로 흐르며 중간값을 남기고, 기울기는 오른쪽에서 왼쪽으로 흐르며 그 중간값을 다시 쓴다(덱 18과 같은 망).</p>
<div class="viz scroll" id="graph"></div>
<div class="ctrl" id="ctl"></div>
<div class="ctrl" id="inp"></div>
<div class="row" style="margin-top:14px">
  <div class="viz" id="check"></div>
  <div class="viz" id="stepv"></div>
</div>
<p class="say" id="say"></p>
<p class="more">이어 보기 · <a href="../../lab/decks/s18.html">덱 18 역전파</a> · <a href="../../lab/decks/s17.html">덱 17 작은 신경망</a></p>
</main>
<script src="../js/pages.js"></script>
<script src="../js/viz.js"></script>
<script>
(function () {
  // ---- 망: z = w·x + b → h = ReLU(z) → ŷ = v·h + c → L = ½(ŷ − y)² ----
  var P = { x: 2, w: 3, b: -1, v: 2, c: 0, y: 4 }, eta = 0.01;
  function forward(p) {
    var z = p.w * p.x + p.b, h = Math.max(0, z), yh = p.v * h + p.c, L = 0.5 * (yh - p.y) * (yh - p.y);
    return { z: z, h: h, yh: yh, L: L };
  }
  function backward(p, f) {
    var dL = 1, dyh = dL * (f.yh - p.y), on = f.z > 0 ? 1 : 0;   // z = 0이면 0 (PyTorch와 같음)
    var dh = dyh * p.v, dz = dh * on;
    return { L: dL, yh: dyh, h: dh, z: dz, x: dz * p.w, w: dz * p.x, b: dz, v: dyh * f.h, c: dyh, on: on };
  }
  function nf(x) {
    var r = Math.round(x * 1000) / 1000;
    var s = String(Math.abs(r) < 1e-9 ? 0 : r);
    return s.replace("-", "−");
  }
  function pm(x) { return x < 0 ? "(" + nf(x) + ")" : nf(x); }
  var F, G;
  function calc() { F = forward(P); G = backward(P, F); }

  // ---- 그림 배치 ----
  var W = 1140, H = 400, Y = 262;
  var N = {   // 값 칸(원)
    x: { x: 60, y: Y, r: 28, name: "x", data: true },
    z: { x: 345, y: Y, r: 28, name: "z" },
    h: { x: 570, y: Y, r: 28, name: "h" },
    yh: { x: 815, y: Y, r: 28, name: "ŷ" },
    L: { x: 1075, y: Y, r: 30, name: "L" },
    w: { x: 140, y: 116, r: 22, name: "w", param: true },
    b: { x: 266, y: 116, r: 22, name: "b", param: true },
    v: { x: 630, y: 116, r: 22, name: "v", param: true },
    c: { x: 760, y: 116, r: 22, name: "c", param: true },
    y: { x: 945, y: 116, r: 22, name: "y", data: true }
  };
  var O = {   // 계산 칸(네모)
    o1: { x: 203, w: 124, f: "w·x + b" },
    o2: { x: 458, w: 92, f: "ReLU" },
    o3: { x: 695, w: 124, f: "v·h + c" },
    o4: { x: 945, w: 124, f: "½(ŷ − y)²" }
  };
  var OH = 54;
  function rightOf(k) { var o = O[k]; return o.x + o.w / 2; }
  function leftOf(k) { var o = O[k]; return o.x - o.w / 2; }
  // 선: [이름, 출발점, 도착점]. 앞으로 흐르는 방향으로 적는다
  var E = {};
  function edgeH(id, a, b) { E[id] = { x1: a[0], y1: a[1], x2: b[0], y2: b[1] }; }
  edgeH("x-o1", [N.x.x + 28, Y], [leftOf("o1"), Y]);
  edgeH("o1-z", [rightOf("o1"), Y], [N.z.x - 28, Y]);
  edgeH("z-o2", [N.z.x + 28, Y], [leftOf("o2"), Y]);
  edgeH("o2-h", [rightOf("o2"), Y], [N.h.x - 28, Y]);
  edgeH("h-o3", [N.h.x + 28, Y], [leftOf("o3"), Y]);
  edgeH("o3-yh", [rightOf("o3"), Y], [N.yh.x - 28, Y]);
  edgeH("yh-o4", [N.yh.x + 28, Y], [leftOf("o4"), Y]);
  edgeH("o4-L", [rightOf("o4"), Y], [N.L.x - 30, Y]);
  function edgeP(id, n, o, dx) { E[id] = { x1: N[n].x, y1: N[n].y + 22, x2: O[o].x + dx, y2: Y - OH / 2 }; }
  edgeP("w-o1", "w", "o1", -30); edgeP("b-o1", "b", "o1", 30);
  edgeP("v-o3", "v", "o3", -30); edgeP("c-o3", "c", "o3", 30);
  edgeP("y-o4", "y", "o4", 0);

  var sv = V.svg(document.getElementById("graph"), W, H, "계산 그래프: x, w, b가 w·x+b 칸을 지나 z, ReLU를 지나 h, v·h+c를 지나 ŷ, 손실 칸을 지나 L이 된다. 거꾸로 L에서 1로 출발한 기울기가 칸마다 배율을 곱하며 왼쪽으로 흐른다");
  var AF = V.arrowDef(sv, "bpf", "var(--muted)");
  var gE = V.s("g", null, sv), gO = V.s("g", null, sv), gN = V.s("g", null, sv), gT = V.s("g", null, sv), gDot = V.s("g", null, sv);
  var el = {};
  Object.keys(E).forEach(function (id) {
    var e = E[id];
    el[id] = V.s("line", { x1: e.x1, y1: e.y1, x2: e.x2, y2: e.y2, class: "ln", "stroke-width": 1.6, "marker-end": AF }, gE);
  });
  var oel = {};
  Object.keys(O).forEach(function (k) {
    var o = O[k];
    var r = V.s("rect", { x: o.x - o.w / 2, y: Y - OH / 2, width: o.w, height: OH, rx: 10, class: "box" }, gO);
    var t1 = V.s("text", { class: "t", x: o.x, y: Y - 4, "text-anchor": "middle", "font-weight": 700, text: o.f }, gO);
    var t2 = V.s("text", { class: "ts mono", x: o.x, y: Y + 16, "text-anchor": "middle" }, gO);
    // 거꾸로 갈 때 이 칸이 곱하는 배율
    var m = V.s("text", { class: "mono", x: o.x, y: Y + OH / 2 + 24, "text-anchor": "middle", "font-size": 14, "font-weight": 700, fill: "var(--k)" }, gO);
    oel[k] = { r: r, t2: t2, m: m };
  });
  var pel = {};   // 매개변수 선 위의 배율
  ["w-o1", "b-o1", "v-o3", "c-o3"].forEach(function (id) {
    var e = E[id], left = id[0] === "w" || id[0] === "v";
    pel[id] = V.s("text", { class: "mono", x: (e.x1 + e.x2) / 2 + (left ? -10 : 10), y: (e.y1 + e.y2) / 2 + 4, "text-anchor": left ? "end" : "start", "font-size": 13, "font-weight": 700, fill: "var(--k)" }, gO);
  });
  var nel = {};
  Object.keys(N).forEach(function (k) {
    var n = N[k];
    var c = V.s("circle", { cx: n.x, cy: n.y, r: n.r, fill: "var(--bg)", stroke: n.param ? "var(--accent)" : "var(--muted)", "stroke-width": n.param ? 2 : 1.4 }, gN);
    var val = V.s("text", { class: "mono", x: n.x, y: n.y + 5, "text-anchor": "middle", "font-size": 15, "font-weight": 700, fill: "var(--text)" }, gN);
    var top = n.param || k === "y";
    var name = V.s("text", { class: "t", x: n.x, y: top ? n.y - n.r - 10 : n.y - n.r - 12, "text-anchor": "middle", "font-weight": 700, text: n.name }, gN);
    var g1 = V.s("text", { class: "mono", x: n.x, y: top ? 30 : Y + 66, "text-anchor": "middle", "font-size": 12, fill: "var(--muted)" }, gT);
    var g2 = V.s("text", { class: "mono", x: n.x, y: top ? 52 : Y + 88, "text-anchor": "middle", "font-size": 15, "font-weight": 700, fill: "var(--k)" }, gT);
    nel[k] = { c: c, val: val, name: name, g1: g1, g2: g2 };
  });
  V.s("text", { class: "ts", x: 10, y: H - 14, text: "보라 테두리 = 고칠 손잡이(매개변수)    회색 = 주어진 자료" }, gT);
  V.s("text", { class: "ts", x: W - 10, y: H - 14, "text-anchor": "end", text: "분홍 = ∂L/∂(그 값): 그 값을 살짝 바꿀 때 손실의 배율" }, gT);

  // ---- 단계: 앞으로 4번, 거꾸로 5번 ----
  var STEPS = [
    { dir: 1, edges: ["x-o1", "w-o1", "b-o1", "o1-z"], say: function () { return "<b>z = w·x + b = " + nf(P.w) + " × " + pm(P.x) + " + " + pm(P.b) + " = " + nf(F.z) + "</b>"; } },
    { dir: 1, edges: ["z-o2", "o2-h"], say: function () { return "<b>h = ReLU(z) = max(0, " + nf(F.z) + ") = " + nf(F.h) + "</b>" + (F.z > 0 ? " · 켜짐" : " · 꺼짐"); } },
    { dir: 1, edges: ["h-o3", "v-o3", "c-o3", "o3-yh"], say: function () { return "<b>ŷ = v·h + c = " + nf(P.v) + " × " + pm(F.h) + " + " + pm(P.c) + " = " + nf(F.yh) + "</b>"; } },
    { dir: 1, edges: ["yh-o4", "y-o4", "o4-L"], say: function () { return "<b>L = ½(ŷ − y)² = ½(" + nf(F.yh) + " − " + pm(P.y) + ")² = " + nf(F.L) + "</b> · 순전파 끝. 중간값 z, h, ŷ을 적어 둔다."; } },
    { dir: -1, edges: [], say: function () { return "<b>∂L/∂L = 1</b> · L을 살짝 바꾸면 L이 그만큼 바뀐다. 여기서 출발."; } },
    { dir: -1, edges: ["o4-L", "yh-o4"], say: function () { return "<b>∂L/∂ŷ = 1 × (ŷ − y) = " + nf(G.yh) + "</b> · 손실 칸의 배율 = 틀린 만큼."; } },
    { dir: -1, edges: ["o3-yh", "h-o3", "v-o3", "c-o3"], say: function () { return "<b>∂L/∂h = " + pm(G.yh) + " × v = " + nf(G.h) + "</b> · 곱 칸은 상대편 값을 곱한다: v 쪽은 × h = " + nf(F.h) + " → " + nf(G.v) + ", 더하기 칸의 c 쪽은 × 1 → " + nf(G.c) + "."; } },
    { dir: -1, edges: ["o2-h", "z-o2"], say: function () { return "<b>∂L/∂z = " + pm(G.h) + " × " + G.on + " = " + nf(G.z) + "</b> · ReLU " + (G.on ? "켜짐 = 그대로 통과(× 1)." : "꺼짐 = 책임이 0(× 0). 이 뒤로는 모두 0."); } },
    { dir: -1, edges: ["o1-z", "x-o1", "w-o1", "b-o1"], say: function () { return "<b>∂L/∂w = " + pm(G.z) + " × x = " + nf(G.w) + ", ∂L/∂b = " + nf(G.b) + ", ∂L/∂x = " + pm(G.z) + " × w = " + nf(G.x) + "</b> · 역전파 끝. 거꾸로 한 번으로 모든 기울기."; } }
  ];
  var shown = 0, busy = false, playing = false;

  function render() {
    var fw = Math.min(shown, 4), bw = Math.max(0, shown - 4);
    // 값: 자료와 매개변수는 늘 보이고, 중간값은 그 단계가 지나야 보인다
    var vals = { x: P.x, w: P.w, b: P.b, v: P.v, c: P.c, y: P.y, z: F.z, h: F.h, yh: F.yh, L: F.L };
    var when = { z: 1, h: 2, yh: 3, L: 4 };
    Object.keys(N).forEach(function (k) {
      var ok = !when[k] || fw >= when[k];
      nel[k].val.textContent = ok ? nf(vals[k]) : "?";
      nel[k].val.setAttribute("fill", ok ? "var(--text)" : "var(--muted)");
    });
    oel.o1.t2.textContent = fw >= 1 ? nf(P.w) + "·" + pm(P.x) + " + " + pm(P.b) : "";
    oel.o2.t2.textContent = fw >= 2 ? "max(0, " + nf(F.z) + ")" : "";
    oel.o3.t2.textContent = fw >= 3 ? nf(P.v) + "·" + pm(F.h) + " + " + pm(P.c) : "";
    oel.o4.t2.textContent = fw >= 4 ? "½(" + nf(F.yh) + " − " + pm(P.y) + ")²" : "";
    // 기울기
    var gw = { L: 1, yh: 2, h: 3, v: 3, c: 3, z: 4, x: 5, w: 5, b: 5 };
    var prod = {
      L: "출발", yh: "1 × " + pm(G.yh), h: pm(G.yh) + " × " + pm(P.v), v: pm(G.yh) + " × " + pm(F.h), c: pm(G.yh) + " × 1",
      z: pm(G.h) + " × " + G.on, x: pm(G.z) + " × " + pm(P.w), w: pm(G.z) + " × " + pm(P.x), b: pm(G.z) + " × 1"
    };
    var gname = { L: "∂L/∂L", yh: "∂L/∂ŷ", h: "∂L/∂h", z: "∂L/∂z", x: "∂L/∂x", w: "∂L/∂w", b: "∂L/∂b", v: "∂L/∂v", c: "∂L/∂c" };
    Object.keys(N).forEach(function (k) {
      var on = gw[k] && bw >= gw[k];
      nel[k].g1.textContent = on ? prod[k] : "";
      nel[k].g2.textContent = on ? gname[k] + " = " + nf(G[k]) : "";
    });
    oel.o4.m.textContent = bw >= 2 ? "× (ŷ − y) = " + nf(F.yh - P.y) : "";
    oel.o3.m.textContent = bw >= 3 ? "× v = " + nf(P.v) : "";
    oel.o2.m.textContent = bw >= 4 ? "× " + G.on + (G.on ? " 켜짐" : " 꺼짐") : "";
    oel.o1.m.textContent = bw >= 5 ? "× w = " + nf(P.w) : "";
    pel["v-o3"].textContent = bw >= 3 ? "× h = " + nf(F.h) : "";
    pel["c-o3"].textContent = bw >= 3 ? "× 1" : "";
    pel["w-o1"].textContent = bw >= 5 ? "× x = " + nf(P.x) : "";
    pel["b-o1"].textContent = bw >= 5 ? "× 1" : "";
    // 지금 단계의 선만 밝힌다
    var cur = shown > 0 ? STEPS[shown - 1] : null;
    Object.keys(E).forEach(function (id) {
      var act = cur && cur.edges.indexOf(id) >= 0;
      el[id].setAttribute("stroke", act ? (cur.dir > 0 ? "var(--accent)" : "var(--k)") : "var(--muted)");
      el[id].setAttribute("stroke-width", act ? 3 : 1.4);
      el[id].setAttribute("opacity", !cur || act ? 1 : 0.45);
    });
    document.getElementById("say").innerHTML = cur ? cur.say() : "<b>▶ 앞으로</b> · x = " + nf(P.x) + ", y = " + nf(P.y) + "이 주어졌고 손잡이 w, b, v, c는 지금 값.";
    stepBtn.disabled = shown >= STEPS.length;
    drawSide();
  }

  // 알갱이: 앞으로는 보라, 거꾸로는 분홍
  function pulse(k) {
    var s = STEPS[k], ids = s.edges;
    if (!ids.length) return V.tween(450, function (e) { nel.L.c.setAttribute("stroke-width", 1.4 + 3 * Math.sin(Math.PI * e)); }).then(function () { nel.L.c.setAttribute("stroke-width", 1.4); });
    // 계산 칸으로 들어가는 선들 → 나오는 선 순서로
    var into = ids.filter(function (id) { return !/^o\d/.test(id); });
    var out = ids.filter(function (id) { return /^o\d/.test(id); });
    var first = s.dir > 0 ? into : out, second = s.dir > 0 ? out : into;
    function run(list, ms) {
      var dots = list.map(function () { return V.s("circle", { r: 6, fill: s.dir > 0 ? "var(--accent)" : "var(--k)", stroke: "var(--bg)", "stroke-width": 2 }, gDot); });
      return V.tween(ms, function (e) {
        list.forEach(function (id, i) {
          var a = E[id], t = s.dir > 0 ? e : 1 - e;
          dots[i].setAttribute("cx", V.lerp(a.x1, a.x2, t)); dots[i].setAttribute("cy", V.lerp(a.y1, a.y2, t));
        });
      }).then(function () { dots.forEach(function (d) { d.remove(); }); });
    }
    return run(first, 520).then(function () { return run(second, 420); });
  }
  function next() {
    if (busy || shown >= STEPS.length) return Promise.resolve();
    busy = true;
    var k = shown;
    // 선을 먼저 밝히고 알갱이를 흘린 뒤 값을 연다
    var cur = STEPS[k];
    Object.keys(E).forEach(function (id) {
      var act = cur.edges.indexOf(id) >= 0;
      el[id].setAttribute("stroke", act ? (cur.dir > 0 ? "var(--accent)" : "var(--k)") : "var(--muted)");
      el[id].setAttribute("opacity", act ? 1 : 0.45);
    });
    // 좁은 화면: 지금 단계가 있는 곳으로 그림을 민다
    var box = document.getElementById("graph");
    if (box.scrollWidth > box.clientWidth + 4) {
      var xs = cur.edges.length ? cur.edges.map(function (id) { return (E[id].x1 + E[id].x2) / 2; }) : [N.L.x];
      var cx = xs.reduce(function (a, b) { return a + b; }, 0) / xs.length;
      box.scrollTo({ left: cx / W * box.scrollWidth - box.clientWidth / 2, behavior: "smooth" });
    }
    return pulse(k).then(function () { shown = k + 1; busy = false; render(); });
  }
  function play() {
    if (playing) { playing = false; playBtn.textContent = "▶ 재생"; return; }
    if (shown >= STEPS.length) { shown = 0; render(); }
    playing = true; playBtn.textContent = "⏸ 멈춤";
    (function loop() {
      if (!playing) return;
      if (shown >= STEPS.length) { playing = false; playBtn.textContent = "▶ 재생"; return; }
      next().then(function () { return V.sleep(650); }).then(loop);
    })();
  }

  // ---- 2. 검산과 한 걸음 ----
  var CW = 560, CH = 290;
  var cv = V.svg(document.getElementById("check"), CW, CH, "역전파로 구한 기울기와, 손잡이를 양쪽으로 0.001씩 돌려 손실 변화를 잰 기울기를 나란히 놓은 표");
  var sw = V.svg(document.getElementById("stepv"), CW, CH, "기울기 반대쪽으로 한 걸음 옮긴 뒤 각 손잡이의 새 값과 손실이 얼마나 줄었는지");
  var gc = V.s("g", null, cv), gs = V.s("g", null, sw);
  function Lof(p) { return forward(p).L; }
  function drawSide() {
    var done = shown >= STEPS.length;
    V.clear(gc); V.clear(gs);
    gc.setAttribute("opacity", done ? 1 : 0.35); gs.setAttribute("opacity", done ? 1 : 0.35);
    // 검산
    V.s("text", { class: "tb", x: 14, y: 26, text: "살짝 돌려 잰 배율 = 역전파?" }, gc);
    V.s("text", { class: "ts mono", x: 14, y: 46, text: "(L(p + 0.001) − L(p − 0.001)) ÷ 0.002" }, gc);
    var cols = [30, 200, 400], hy = 80;
    ["", "역전파", "돌려 잰 값"].forEach(function (h, i) { V.s("text", { class: "ts", x: cols[i] + (i ? 90 : 0), y: hy, "text-anchor": i ? "end" : "start", text: h }, gc); });
    ["w", "b", "v", "c", "x"].forEach(function (k, i) {
      var y = hy + 30 + i * 30, e = 1e-3;
      var a = Object.assign({}, P), bq = Object.assign({}, P); a[k] += e; bq[k] -= e;
      var num = (Lof(a) - Lof(bq)) / (2 * e);
      V.s("line", { class: "ln-g", x1: 20, x2: CW - 20, y1: y - 20, y2: y - 20 }, gc);
      V.s("text", { class: "t", x: cols[0], y: y, "font-weight": 700, text: "∂L/∂" + k }, gc);
      V.s("text", { class: "mono", x: cols[1] + 90, y: y, "text-anchor": "end", "font-size": 15, "font-weight": 700, fill: "var(--k)", text: done ? nf(G[k]) : "?" }, gc);
      V.s("text", { class: "t mono", x: cols[2] + 90, y: y, "text-anchor": "end", text: V.fmt(num, 6) }, gc);
    });
    // 한 걸음
    var p2 = {}; ["w", "b", "v", "c"].forEach(function (k) { p2[k] = P[k] - eta * G[k]; });
    p2.x = P.x; p2.y = P.y;
    var L2 = Lof(p2);
    V.s("text", { class: "tb", x: 14, y: 26, text: "한 걸음: 새 값 = 지금 − η × 기울기" }, gs);
    V.s("text", { class: "ts mono", x: 14, y: 46, text: "η = " + nf(eta) }, gs);
    var c2 = [30, 140, 250, 360], y0 = 80;
    ["", "지금", "기울기", "새 값"].forEach(function (h, i) { V.s("text", { class: "ts", x: c2[i] + (i ? 70 : 0), y: y0, "text-anchor": i ? "end" : "start", text: h }, gs); });
    ["w", "b", "v", "c"].forEach(function (k, i) {
      var y = y0 + 30 + i * 30;
      V.s("line", { class: "ln-g", x1: 20, x2: 450, y1: y - 20, y2: y - 20 }, gs);
      V.s("text", { class: "t", x: c2[0], y: y, "font-weight": 700, text: k }, gs);
      V.s("text", { class: "t mono", x: c2[1] + 70, y: y, "text-anchor": "end", text: nf(P[k]) }, gs);
      V.s("text", { class: "mono", x: c2[2] + 70, y: y, "text-anchor": "end", "font-size": 14, fill: "var(--k)", text: done ? nf(G[k]) : "?" }, gs);
      V.s("text", { class: "mono", x: c2[3] + 70, y: y, "text-anchor": "end", "font-size": 15, "font-weight": 700, fill: "var(--accent)", text: done ? nf(p2[k]) : "?" }, gs);
    });
    // 손실 막대: 전·후
    var bx = 470, base = 236, top = 70, mxL = Math.max(F.L, L2, 1e-9);
    [[F.L, "전"], [L2, "뒤"]].forEach(function (a, i) {
      var hgt = (base - top) * a[0] / mxL, x = bx + i * 40;
      V.s("rect", { x: x, y: base - hgt, width: 28, height: Math.max(hgt, 0.5), rx: 3, fill: i ? "var(--accent)" : "var(--muted)", opacity: i && !done ? 0 : 0.85 }, gs);
      V.s("text", { class: "ts mono", x: x + 14, y: base - hgt - 6, "text-anchor": "middle", text: i && !done ? "" : nf(a[0]) }, gs);
      V.s("text", { class: "ts", x: x + 14, y: base + 18, "text-anchor": "middle", text: a[1] }, gs);
    });
    V.s("text", { class: "ts", x: bx + 34, y: 278, "text-anchor": "middle", text: "손실 L" }, gs);
  }

  // ---- 손잡이 ----
  var ctl = document.getElementById("ctl");
  var playBtn = V.button(ctl, "▶ 재생", play, "primary");
  var stepBtn = V.button(ctl, "⏭ 한 단계", function () { playing = false; playBtn.textContent = "▶ 재생"; next(); });
  V.button(ctl, "↺ 처음으로", function () { playing = false; playBtn.textContent = "▶ 재생"; if (!busy) { shown = 0; render(); } });
  V.button(ctl, "⏩ 끝까지", function () { playing = false; playBtn.textContent = "▶ 재생"; if (!busy) { shown = STEPS.length; render(); } });
  var inp = document.getElementById("inp");
  [["x", -3, 3, 0.5], ["w", -3, 3, 0.5], ["b", -8, 4, 0.5], ["v", -3, 3, 0.5], ["c", -3, 3, 0.5], ["y", -4, 12, 0.5]].forEach(function (a) {
    V.slider(inp, { label: a[0], min: a[1], max: a[2], step: a[3], value: P[a[0]], fmt: function (v) { return nf(v); },
      onInput: function (v) { P[a[0]] = v; calc(); render(); } });
  });
  V.slider(inp, { label: "η", min: 0.001, max: 0.05, step: 0.001, value: eta, fmt: function (v) { return nf(v); }, onInput: function (v) { eta = v; render(); } });
  V.onTheme.push(render);
  calc(); render();
})();
</script>
</body>
</html>
