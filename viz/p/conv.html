<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>합성곱 · 움직이는 AI</title>
<link rel="stylesheet" href="../style.css">
<style>
  .kgrid { display: inline-grid; grid-template-columns: repeat(3, 3.6em); gap: 3px; vertical-align: middle; }
  .kgrid input { font: inherit; font-size: .85rem; width: 100%; padding: 3px 4px; text-align: center; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
  .kgrid input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  .klab { font-size: .9rem; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
</style>
</head>
<body data-page="conv">
<main class="stage">
<h1>합성곱 = 작은 필터가 미끄러지며 곱해서 더하기</h1>
<p class="sub">같은 3×3 가중치를 모든 위치에 대고, 겹친 9칸을 곱해 더한 값 하나가 출력 한 칸이 된다. 필터는 뒤집지 않는다(교차 상관, PyTorch 규약). 편향 0.</p>
<div class="ctrl" id="kctl"></div>
<div class="row" style="margin-top:12px">
  <div class="viz" id="pin"></div>
  <div class="viz" id="pcalc"></div>
  <div class="viz" id="pout"></div>
</div>
<div class="ctrl" id="ctl"></div>
<div class="ctrl" id="ctl2"></div>
<p class="say" id="say"></p>
<p class="more">이어 보기 · <a href="../../learn/notes/dl/dl05-1.html">필터를 옮겨 합성곱의 출력 칸 계산하기</a> · <a href="../../learn/notes/dl/dl05-2.html">채널을 섞고 풀링하기</a> · <a href="cnn.html">CNN 전체</a></p>
</main>
<script src="../js/pages.js"></script>
<script src="../js/viz.js"></script>
<script>
(function () {
  var N = 12;                                   // 입력 12×12, 값 0(빈칸)~1(진한 잉크)
  var img = [], i, j;
  for (i = 0; i < N; i++) { img.push(new Array(N).fill(0)); }

  // ---- 붓: 화소 중심에서 선분까지 거리 d → 값 = clamp(R + 0.5 − d, 0, 1) ----
  var R = 0.7;
  function segD(px, py, ax, ay, bx, by) {
    var dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
    var t = L > 0 ? V.clamp(((px - ax) * dx + (py - ay) * dy) / L, 0, 1) : 0;
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
  }
  function stroke(ax, ay, bx, by, erase) {
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      var v = V.clamp(R + 0.5 - segD(c + 0.5, r + 0.5, ax, ay, bx, by), 0, 1);
      if (erase) img[r][c] = Math.min(img[r][c], 1 - V.clamp(v * 1.6, 0, 1));
      else img[r][c] = Math.max(img[r][c], v);
    }
  }
  var SHAPES = {
    "4": [[[7.6, 10.6], [7.6, 1.4], [2.2, 7.6], [10, 7.6]]],
    "7": [[[2, 2], [9.8, 2], [5, 10.5]]],
    "0": [(function () { var p = []; for (var a = 0; a <= 40; a++) { var t = a / 40 * 2 * Math.PI; p.push([6 + 3 * Math.cos(t), 6 + 4.2 * Math.sin(t)]); } return p; })()],
    "+": [[[6, 1.5], [6, 10.5]], [[1.5, 6], [10.5, 6]]]
  };
  function loadShape(k) {
    for (var r = 0; r < N; r++) img[r].fill(0);
    SHAPES[k].forEach(function (p) { for (var m = 0; m < p.length - 1; m++) stroke(p[m][0], p[m][1], p[m + 1][0], p[m + 1][1]); });
  }

  // ---- 필터 ----
  var PRE = {
    "세로 경계": { k: ["-1", "0", "1", "-2", "0", "2", "-1", "0", "1"],
      say: "<b>왼쪽 열 −, 오른쪽 열 +.</b> 오른쪽이 왼쪽보다 진하면 +, 반대면 −. 세로 선의 왼쪽 가장자리는 보라, 오른쪽 가장자리는 주황으로 나온다. 가로 선은 거의 0." },
    "가로 경계": { k: ["-1", "-2", "-1", "0", "0", "0", "1", "2", "1"],
      say: "<b>위 줄 −, 아래 줄 +.</b> 아래가 위보다 진하면 +. 가로 선의 위쪽 가장자리는 보라, 아래쪽은 주황. 세로 선은 거의 0." },
    "흐리기": { k: ["1/16", "2/16", "1/16", "2/16", "4/16", "2/16", "1/16", "2/16", "1/16"],
      say: "<b>가중치가 모두 양수이고 합이 1.</b> 이웃의 가중 평균이라 선이 번지고 굵어진다. 바탕이 고르면 출력도 입력과 같다." },
    "선명하게": { k: ["0", "-1", "0", "-1", "5", "-1", "0", "-1", "0"],
      say: "<b>가운데 ×5, 상하좌우 ×(−1). 합은 1.</b> 고른 곳은 그대로, 이웃과 다른 곳은 그 차이를 키운다. 선 바로 옆 칸이 음수로 파인다." }
  };
  var pname = "세로 경계", ktext = PRE[pname].k.slice(), K = [];
  function parse(s) {
    s = String(s).replace("−", "-").trim();
    var m = s.match(/^(-?[\d.]+)\s*\/\s*([\d.]+)$/);
    var v = m ? (+m[1]) / (+m[2]) : +s;
    return isFinite(v) ? v : 0;
  }
  function setK() { K = ktext.map(parse); }
  setK();

  var S = 1, P = 0;                            // 보폭, 테두리
  function outN() { return Math.floor((N + 2 * P - 3) / S) + 1; }
  function px(r, c) { var rr = r - P, cc = c - P; return (rr < 0 || cc < 0 || rr >= N || cc >= N) ? 0 : img[rr][cc]; } // 테두리 좌표
  function convAt(oi, oj) {                    // y[i,j] = Σ x[S·i+m, S·j+n] · w[m,n]
    var s = 0;
    for (var m = 0; m < 3; m++) for (var n = 0; n < 3; n++) s += px(S * oi + m, S * oj + n) * K[m * 3 + n];
    return s;
  }
  var out = [], mx = 1;
  function computeAll() {
    var on = outN(); out = []; mx = 1e-9;
    for (var a = 0; a < on; a++) { out.push([]); for (var b = 0; b < on; b++) { var v = convAt(a, b); out[a].push(v); mx = Math.max(mx, Math.abs(v)); } }
  }

  // ---- 진행 상태 ----
  var done = 0, ci = 0, phase = 0, playing = true, once = false, speed = 2.5, focus = null;
  function total() { var o = outN(); return o * o; }
  function cur() { if (focus) return focus; var k = Math.min(ci, total() - 1); return [Math.floor(k / outN()), k % outN()]; }

  var fmt2 = function (x) { return V.fmt(Math.abs(x) < 0.005 ? 0 : x, 2); };
  function fmtW(w) { return Math.abs(w - Math.round(w)) < 1e-9 ? V.fmt(w, 0) : V.fmt(w, 2); }

  // ===== 1. 입력 =====
  var IW = 420, IH = 450, GX = 30, GY = 56, G = 360;
  var sin = V.svg(document.getElementById("pin"), IW, IH, "12×12 입력 그림 위를 3×3 필터 창이 한 칸씩 미끄러진다. 테두리를 켜면 바깥에 0 칸 한 줄이 생긴다");
  var inTitle = V.s("text", { class: "tb", x: GX, y: 24 }, sin);
  var inSub = V.s("text", { class: "ts", x: GX, y: 42 }, sin);
  var gCells = V.s("g", null, sin), gWin = V.s("g", null, sin);
  var cellEls = [], padEls = [];
  var win = V.s("rect", { fill: "var(--accent-soft)", "fill-opacity": 0.35, stroke: "var(--accent)", "stroke-width": 3, rx: 4, style: "transition: transform .18s ease" }, gWin);
  var winTxt = [];
  for (i = 0; i < 9; i++) winTxt.push(V.s("text", { class: "mono", "text-anchor": "middle", "font-size": 10, "pointer-events": "none" }, gWin));
  var cs = 30;
  function buildIn() {
    V.clear(gCells); cellEls = []; padEls = [];
    var n = N + 2 * P; cs = G / n;
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
      var isPad = r < P || c < P || r >= N + P || c >= N + P;
      var x = GX + c * cs, y = GY + r * cs;
      if (isPad) { padEls.push(V.s("rect", { x: x + 1, y: y + 1, width: cs - 2, height: cs - 2, rx: 2, fill: "none", stroke: "var(--muted)", "stroke-dasharray": "3 3", opacity: 0.6 }, gCells)); continue; }
      V.s("rect", { x: x, y: y, width: cs, height: cs, fill: "var(--bg)", class: "cell" }, gCells);
      var e = V.s("rect", { x: x, y: y, width: cs, height: cs, fill: "var(--text)", "pointer-events": "none" }, gCells);
      cellEls.push(e);
    }
    win.setAttribute("width", 3 * cs); win.setAttribute("height", 3 * cs);
    inTitle.textContent = "입력 " + N + "×" + N + (P ? "  + 테두리 0 한 줄 → " + n + "×" + n : "");
    inSub.textContent = "끌어서 그린다 · 진하기 0~1";
  }
  function paintIn() {
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) cellEls[r * N + c].setAttribute("fill-opacity", img[r][c].toFixed(3));
  }

  // ===== 2. 계산 =====
  var CW = 420, CH = 450, CS = 38, PX0 = 14, KX0 = 154, QX0 = 294, CY0 = 56;
  var sc = V.svg(document.getElementById("pcalc"), CW, CH, "창 안의 입력 9칸과 필터 9칸을 같은 자리끼리 곱하고, 9개 곱을 모두 더해 출력 한 칸을 만든다");
  V.s("text", { class: "ts", x: PX0 + 1.5 * CS, y: CY0 - 10, "text-anchor": "middle", text: "창 안 입력 x" }, sc);
  V.s("text", { class: "ts", x: KX0 + 1.5 * CS, y: CY0 - 10, "text-anchor": "middle", text: "필터 w" }, sc);
  V.s("text", { class: "ts", x: QX0 + 1.5 * CS, y: CY0 - 10, "text-anchor": "middle", text: "같은 자리끼리 곱" }, sc);
  var calcTitle = V.s("text", { class: "tb", x: PX0, y: 24 }, sc);
  V.s("text", { class: "t", x: KX0 - 7, y: CY0 + 1.5 * CS + 6, "text-anchor": "middle", text: "×" }, sc);
  V.s("text", { class: "t", x: QX0 - 7, y: CY0 + 1.5 * CS + 6, "text-anchor": "middle", text: "=" }, sc);
  function grid3(x0) {
    var cells = [], txt = [];
    for (var m = 0; m < 9; m++) {
      var x = x0 + (m % 3) * CS, y = CY0 + Math.floor(m / 3) * CS;
      cells.push(V.s("rect", { x: x, y: y, width: CS, height: CS, class: "cell", fill: "var(--bg)" }, sc));
      txt.push(V.s("text", { class: "mono", x: x + CS / 2, y: y + CS / 2 + 4, "text-anchor": "middle", "font-size": 11 }, sc));
    }
    return { c: cells, t: txt };
  }
  var gP = grid3(PX0), gK = grid3(KX0), gQ = grid3(QX0);
  var SX = QX0 + 1.5 * CS, SY = 250;
  var sumLines = [];
  for (i = 0; i < 9; i++) {
    var qx = QX0 + (i % 3) * CS + CS / 2, qy = CY0 + Math.floor(i / 3) * CS + CS / 2;
    sumLines.push(V.s("path", { class: "ln", d: "M" + qx + " " + qy + " C " + qx + " " + (qy + 60) + ", " + SX + " " + (SY - 70) + ", " + SX + " " + (SY - 26), opacity: 0.25 }, sc));
  }
  // 곱 칸이 선 위에 오도록 다시 붙인다
  gQ.c.concat(gQ.t).forEach(function (e) { sc.appendChild(e); });
  var sumC = V.s("circle", { cx: SX, cy: SY, r: 26, fill: "var(--bg)", stroke: "var(--accent)", "stroke-width": 2 }, sc);
  V.s("text", { class: "ts", x: SX, y: SY - 32, "text-anchor": "middle", text: "" }, sc);
  var sumT = V.s("text", { class: "mono", x: SX, y: SY + 5, "text-anchor": "middle", "font-size": 14, "font-weight": 700 }, sc);
  V.s("text", { class: "ts", x: SX + 34, y: SY + 4, text: "Σ" }, sc);
  var exprT = [];
  for (i = 0; i < 3; i++) exprT.push(V.s("text", { class: "mono", x: PX0, y: 196 + i * 22, "font-size": 11.5, fill: "var(--text)" }, sc));
  var exprSum = V.s("text", { class: "mono", x: PX0, y: 196 + 3 * 22 + 2, "font-size": 13, "font-weight": 700, fill: "var(--accent)" }, sc);
  V.s("line", { class: "ln", x1: SX, y1: SY + 26, x2: SX, y2: 330, "marker-end": V.arrowDef(sc, "ca", "var(--muted)") }, sc);
  var resT = V.s("text", { class: "tb", x: SX, y: 356, "text-anchor": "middle" }, sc);
  var posT = V.s("text", { class: "ts", x: PX0, y: 400 }, sc);
  var posT2 = V.s("text", { class: "ts", x: PX0, y: 420 }, sc);

  // ===== 3. 출력 =====
  var OW = 420, OH = 450;
  var so = V.svg(document.getElementById("pout"), OW, OH, "출력 특징 지도. 계산이 끝난 칸이 하나씩 색으로 채워진다. 양수는 보라, 음수는 주황");
  var outTitle = V.s("text", { class: "tb", x: GX, y: 24 }, so);
  var outSub = V.s("text", { class: "ts mono", x: GX, y: 42 }, so);
  var gOut = V.s("g", null, so), oEls = [], oTxt = [], oCur = V.s("rect", { fill: "none", stroke: "var(--accent)", "stroke-width": 3, rx: 3, "pointer-events": "none" }, so);
  var oFoot = V.s("text", { class: "ts", x: GX, y: OH - 10 }, so);
  var ocs = 30, ox0 = GX, oy0 = GY;
  function buildOut() {
    V.clear(gOut); oEls = []; oTxt = [];
    var on = outN(); ocs = cs;                 // 입력과 같은 칸 크기 → 줄어든 크기가 그대로 보인다
    ox0 = GX + (G - on * ocs) / 2; oy0 = GY + (G - on * ocs) / 2;
    for (var a = 0; a < on; a++) for (var b = 0; b < on; b++) {
      var x = ox0 + b * ocs, y = oy0 + a * ocs;
      var e = V.s("rect", { x: x, y: y, width: ocs, height: ocs, class: "cell", "data-k": a * on + b, style: "cursor:pointer" }, gOut);
      oEls.push(e);
      oTxt.push(V.s("text", { class: "mono", x: x + ocs / 2, y: y + ocs / 2 + 3.5, "text-anchor": "middle", "font-size": ocs >= 28 ? 10 : 9, "pointer-events": "none" }, gOut));
    }
    oCur.setAttribute("width", ocs); oCur.setAttribute("height", ocs);
    outTitle.textContent = "출력 " + on + "×" + on;
    outSub.textContent = "⌊(" + N + " + 2·" + P + " − 3) / " + S + "⌋ + 1 = " + on;
    oFoot.textContent = "칸을 가리키면 그 칸의 계산을 본다";
  }
  function inkFor(v) { // 진한 칸 위 글자는 바탕색
    return Math.abs(v) / mx > 0.55 ? "var(--bg)" : "var(--text)";
  }
  function paintOut() {
    var on = outN();
    for (var k = 0; k < oEls.length; k++) {
      var a = Math.floor(k / on), b = k % on, v = out[a][b];
      if (k < done) {
        oEls[k].setAttribute("fill", V.signed(v, mx)); oEls[k].removeAttribute("stroke-dasharray");
        oTxt[k].textContent = V.fmt(Math.abs(v) < 0.05 ? 0 : v, 1); oTxt[k].setAttribute("fill", inkFor(v));
      } else {
        oEls[k].setAttribute("fill", "var(--bg)"); oEls[k].setAttribute("stroke-dasharray", "3 3");
        oTxt[k].textContent = "";
      }
    }
    legend();
  }
  so.addEventListener("pointerover", function (e) {
    var k = e.target.getAttribute && e.target.getAttribute("data-k");
    if (k == null) return;
    k = +k; focus = [Math.floor(k / outN()), k % outN()]; render();
  });
  so.addEventListener("pointerleave", function () { focus = null; render(); });

  // ===== 그리기 (현재 위치) =====
  function render() {
    var c = cur(), oi = c[0], oj = c[1], r0 = S * oi, c0 = S * oj;
    var showPhase = focus || ci < done ? 1 : phase;
    win.style.transform = "translate(" + (GX + c0 * cs) + "px," + (GY + r0 * cs) + "px)";
    var sum = 0, shown = 0;
    for (var m = 0; m < 9; m++) {
      var rr = r0 + Math.floor(m / 3), cc = c0 + m % 3;
      var x = px(rr, cc), w = K[m], q = x * w;
      var t = winTxt[m];
      t.setAttribute("x", GX + cc * cs + cs / 2); t.setAttribute("y", GY + rr * cs + cs / 2 + 3.5);
      t.textContent = x < 0.05 ? "0" : x > 0.995 ? "1" : V.fmt(x, 1).replace(/^0\./, ".");
      t.setAttribute("fill", x > 0.55 ? "var(--bg)" : "var(--text)");
      gP.c[m].setAttribute("fill", "var(--text)"); gP.c[m].setAttribute("fill-opacity", (0.05 + 0.75 * x).toFixed(3));
      gP.t[m].textContent = fmt2(x); gP.t[m].setAttribute("fill", x > 0.5 ? "var(--bg)" : "var(--text)");
      gK.c[m].setAttribute("fill", V.signed(w, 2)); gK.t[m].textContent = ktext[m].replace("-", "−");
      gK.t[m].setAttribute("fill", Math.abs(w) > 1.2 ? "var(--bg)" : "var(--text)");
      var vis = showPhase >= (m + 1) / 11;
      gQ.c[m].setAttribute("fill", vis ? V.signed(q, 2) : "var(--bg)");
      gQ.t[m].textContent = vis ? fmt2(q) : "";
      gQ.t[m].setAttribute("fill", Math.abs(q) > 1.2 ? "var(--bg)" : "var(--text)");
      sumLines[m].setAttribute("opacity", vis ? (Math.abs(q) > 0.005 ? 0.9 : 0.25) : 0.08);
      sumLines[m].setAttribute("stroke", vis && Math.abs(q) > 0.005 ? (q > 0 ? "var(--accent)" : "var(--neg)") : "var(--muted)");
      if (vis) { sum += q; shown++; }
    }
    for (var row = 0; row < 3; row++) {
      var parts = [];
      for (var n = 0; n < 3; n++) {
        var mm = row * 3 + n, xv = px(r0 + row, c0 + n), wv = K[mm];
        parts.push(fmt2(xv) + "×" + (wv < 0 ? "(" + fmtW(wv) + ")" : fmtW(wv)));
      }
      exprT[row].textContent = (row ? "+ " : "  ") + parts.join(" + ");
    }
    var full = convAt(oi, oj);
    var fin = showPhase >= 10 / 11;
    sumT.textContent = shown ? fmt2(fin ? full : sum) : "";
    sumC.setAttribute("fill", fin ? V.signed(full, mx) : "var(--bg)");
    sumT.setAttribute("fill", fin && Math.abs(full) / mx > 0.55 ? "var(--bg)" : "var(--text)");
    exprSum.textContent = fin ? "= " + fmt2(full) : "";
    resT.textContent = fin ? "출력[" + oi + ", " + oj + "] = " + fmt2(full) : "출력[" + oi + ", " + oj + "] = …";
    calcTitle.textContent = "출력[" + oi + ", " + oj + "] 계산";
    posT.textContent = "창의 왼쪽 위 = " + (P ? "테두리 포함 " : "") + "입력 (" + S + "·" + oi + ", " + S + "·" + oj + ") = (" + r0 + ", " + c0 + ")";
    posT2.textContent = "계산한 칸 " + Math.min(done, total()) + " / " + total();
    var on = outN();
    oCur.setAttribute("x", ox0 + oj * ocs); oCur.setAttribute("y", oy0 + oi * ocs);
  }

  // ===== 손잡이 =====
  var kc = document.getElementById("kctl");
  var pre = V.seg(kc, Object.keys(PRE).concat(["직접"]), pname, function (n) {
    if (n === "직접") { pname = n; say(); return; }
    pname = n; ktext = PRE[n].k.slice(); setK(); syncK(); recompute(false);
  });
  var klab = V.h("span", "klab", null, kc); V.h("span", "", "가중치", klab);
  var kg = V.h("span", "kgrid", null, klab), kin = [];
  for (i = 0; i < 9; i++) (function (m) {
    var inp = V.h("input", "mono", null, kg); inp.type = "text"; inp.inputMode = "decimal"; inp.setAttribute("aria-label", "필터 " + (Math.floor(m / 3) + 1) + "행 " + (m % 3 + 1) + "열");
    inp.addEventListener("input", function () { ktext[m] = inp.value; setK(); pname = "직접"; pre.set("직접"); recompute(false); });
    kin.push(inp);
  })(i);
  function syncK() { kin.forEach(function (inp, m) { inp.value = ktext[m]; }); }
  syncK();
  var sl = V.h("span", "klab", null, kc); V.h("span", "", "보폭 S", sl);
  V.seg(sl, ["1", "2"], "1", function (v) { S = +v; recompute(true); });
  var pl = V.h("span", "klab", null, kc); V.h("span", "", "테두리 P", pl);
  V.seg(pl, ["0", "1"], "0", function (v) { P = +v; recompute(true); });

  var c1 = document.getElementById("ctl");
  var playB = V.button(c1, "⏸ 멈춤", function () { if (done >= total()) { done = 0; ci = 0; phase = 0; paintOut(); } once = false; playing = !playing; playB.textContent = playing ? "⏸ 멈춤" : "▶ 재생"; playB.classList.toggle("primary", playing); render(); }, "primary");
  V.button(c1, "⏭ 한 칸", function () { if (done >= total()) return; playing = false; once = true; phase = 0; ci = done; playB.textContent = "▶ 재생"; playB.classList.remove("primary"); });
  V.button(c1, "⏩ 끝까지", function () { playing = false; once = false; done = total(); ci = done - 1; phase = 0; playB.textContent = "▶ 재생"; playB.classList.remove("primary"); paintOut(); render(); });
  V.button(c1, "↺ 처음으로", function () { playing = false; once = false; done = 0; ci = 0; phase = 0; playB.textContent = "▶ 재생"; playB.classList.add("primary"); paintOut(); render(); });
  V.slider(c1, { label: "속도", min: 0.5, max: 12, step: 0.5, value: speed, fmt: function (x) { return V.fmt(x, 1) + "칸/초"; }, onInput: function (v) { speed = v; } });
  var legBox = V.h("span", "", null, c1);
  function legend() { V.clear(legBox); V.legend(legBox, -mx, mx, true); }

  var c2 = document.getElementById("ctl2");
  var mode = "그리기";
  var ml = V.h("span", "klab", null, c2); V.h("span", "", "붓", ml);
  V.seg(ml, ["그리기", "지우기"], mode, function (v) { mode = v; });
  var ex = V.h("span", "klab", null, c2); V.h("span", "", "예시", ex);
  V.seg(ex, ["4", "7", "0", "+"], "4", function (v) { loadShape(v); recompute(false); });
  V.button(c2, "모두 지우기", function () { for (var r = 0; r < N; r++) img[r].fill(0); recompute(false); });

  function say() {
    document.getElementById("say").innerHTML = (PRE[pname] ? PRE[pname].say : "<b>가중치를 직접 바꿨다.</b> 양수 칸은 그 자리 잉크를 더하고, 음수 칸은 뺀다. 출력은 즉시 다시 계산된다.") +
      " 출력 " + outN() + "×" + outN() + (S === 2 ? " — 보폭 2는 창을 두 칸씩 건너뛰어 크기가 약 절반." : "") + (P ? " — 테두리 0을 두르면 가장자리에도 창을 댈 수 있어 크기가 덜 준다." : "");
  }
  function recompute(resize) {
    computeAll();
    if (resize) { buildIn(); buildOut(); done = Math.min(done, total()); ci = Math.min(ci, Math.max(0, done - (done >= total() ? 1 : 0))); focus = null; }
    paintIn(); paintOut(); render(); say();
  }

  // 그리기
  var drawing = false, last = null;
  function toGrid(ev) {
    var pt = sin.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    var q = pt.matrixTransform(sin.getScreenCTM().inverse());
    return [(q.x - GX) / cs - P, (q.y - GY) / cs - P];
  }
  sin.style.touchAction = "none"; sin.style.userSelect = "none"; sin.style.cursor = "crosshair";
  sin.addEventListener("pointerdown", function (e) { e.preventDefault(); drawing = true; sin.setPointerCapture(e.pointerId); last = toGrid(e); stroke(last[0], last[1], last[0], last[1], mode === "지우기"); recompute(false); });
  sin.addEventListener("pointermove", function (e) { if (!drawing) return; var p = toGrid(e); stroke(last[0], last[1], p[0], p[1], mode === "지우기"); last = p; recompute(false); });
  sin.addEventListener("pointerup", function () { drawing = false; });
  sin.addEventListener("pointercancel", function () { drawing = false; });

  // 움직임
  V.loop(function (dt) {
    if (!(playing || once) || focus) return;
    if (done >= total()) { playing = false; once = false; playB.textContent = "▶ 재생"; return; }
    ci = done; phase += dt * speed;
    if (phase >= 1) {
      phase = 0; done++;
      if (once) { once = false; ci = done - 1; }
      paintOut();
      if (done >= total()) { playing = false; ci = done - 1; playB.textContent = "▶ 재생"; playB.classList.remove("primary"); }
    }
    render();
  });
  V.onTheme.push(function () { paintOut(); render(); });

  loadShape("4");
  computeAll(); buildIn(); buildOut(); paintIn(); paintOut(); render(); say();
})();
</script>
</body>
</html>
